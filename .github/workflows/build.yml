name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        env:
          # Optional: add these as repository secrets so the APK has your keys baked in.
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SPORTSDB_API_KEY: ${{ secrets.SPORTSDB_API_KEY }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: HomeBase-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Unit tests + home screen screenshots
        run: ./gradlew --no-daemon recordPaparazziDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HomeBase-screenshots
          path: app/src/test/snapshots/images/
          if-no-files-found: ignore
