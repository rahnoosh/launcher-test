name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the job commit updated screenshots back to the branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        env:
          # Optional: add these as repository secrets so the APK has your keys baked in.
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SPORTSDB_API_KEY: ${{ secrets.SPORTSDB_API_KEY }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: HomeBase-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Unit tests + home screen screenshots
        run: ./gradlew --no-daemon recordPaparazziDebug
      - name: Commit updated screenshots
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/snapshots/images
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update home screen screenshots"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HomeBase-screenshots
          path: app/src/test/snapshots/images/
          if-no-files-found: ignore
