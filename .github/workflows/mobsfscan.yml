name: mobsfscan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobsfscan:
    name: mobsfscan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails on security errors; warnings and hardening tips are only listed. Rules reviewed as
      # not applying to HomeBase are listed, with the reasons, in .mobsf.
      - name: mobsfscan
        env:
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: |
          pip install --quiet mobsfscan==1.1.0 semgrep==1.172.0
          mobsfscan .
