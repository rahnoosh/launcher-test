name: osv-scanner

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The repo keeps no Gradle lockfile, so write one for this run: the exact versions of
      # everything that ships in the APK (the release runtime classpath), which osv-scanner reads.
      - name: Resolve the libraries in the APK
        run: |
          cat > "$RUNNER_TEMP/lock-apk.gradle" <<'GRADLE'
          allprojects {
              configurations.matching { it.name == "releaseRuntimeClasspath" }.configureEach {
                  resolutionStrategy.activateDependencyLocking()
              }
          }
          GRADLE
          ./gradlew --no-daemon -q --init-script "$RUNNER_TEMP/lock-apk.gradle" \
            :app:dependencies --configuration releaseRuntimeClasspath --write-locks
          cat app/gradle.lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # Fails if any of those libraries has a known vulnerability.
      - name: osv-scanner
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          "$(go env GOPATH)/bin/osv-scanner" scan source --lockfile app/gradle.lockfile
