name: detekt

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detekt:
    name: detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Fails on findings that aren't in config/detekt/baseline.xml.
      - name: detekt
        run: ./gradlew --no-daemon detekt
